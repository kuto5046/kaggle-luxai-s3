[project]
name = "kaggle-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "catboost>=1.2.7",
  "hydra-core>=1.3.2",
  "ipykernel>=6.29.5",
  "ipywidgets>=8.1.5",
  "kaggle==1.6.1", # >=1.6.9だとエラーが出る
  "kagglehub>=0.3.3",
  "lightgbm>=4.5",
  "lightning>=2.3.3",
  "mypy>=1.11.2",
  "nbformat>=5.10.4",
  "optuna>=4",
  "pandas>=2.2.2",
  "peft>=0.13.2",
  "polars>=1.7.1",
  "pre-commit>=3.8",
  "pyarrow>=17",
  "pydantic>=2.7.4",
  "pytest>=8.3.3",
  "rich>=13.8.1",
  "ruff>=0.6.5",
  "scikit-learn>=1.5.2",
  "seaborn>=0.13.2",
  "streamlit>=1.38",
  "timm>=1.0.9",
  "torch==2.4.0+cu121",
  "torch-geometric>=2.6",
  "wandb>=0.18.1",
  "xgboost>=2.1.1",
  "markupsafe==3.0.0", # 3.0.2だとpytorchのエラーが出る
  "luxai-s3>=0.1.1",
]

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu121"]
index-strategy = "unsafe-best-match"
